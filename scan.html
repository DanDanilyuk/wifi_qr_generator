<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; base-uri 'self'; form-action 'none'"
    />
    <meta
      name="description"
      content="Scan-only Wi-Fi QR view. Lightweight read-only display for guest phones."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#b84c12" />
    <title>Wi-Fi QR - Scan</title>
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="scan.js"></script>
  </head>

  <body>
    <header class="site-header">
      <div>
        <h1>Wi-Fi access</h1>
        <p class="tagline">Scan to connect. No typing.</p>
      </div>
    </header>

    <main>
      <noscript>
        <p class="card">This page needs JavaScript to draw the QR code.</p>
      </noscript>

      <section class="card result" aria-labelledby="scan-heading">
        <header class="result-header">
          <div>
            <p class="kicker">Ready to share</p>
            <h2 id="scan-heading">Scan to connect</h2>
          </div>
          <p class="hint">Point your camera at the QR code to join instantly.</p>
        </header>

        <div id="scan-body" class="result-body">
          <canvas id="qr" class="qr" role="img" aria-label="Wi-Fi QR code"></canvas>
          <dl class="details">
            <div>
              <dt>Network</dt>
              <dd id="result-ssid"></dd>
            </div>
            <div>
              <dt>Security</dt>
              <dd id="result-security"></dd>
            </div>
            <div id="result-hidden-row">
              <dt>Hidden</dt>
              <dd>Yes</dd>
            </div>
            <div id="result-password-row">
              <dt>Password</dt>
              <dd id="result-password"></dd>
            </div>
          </dl>
        </div>

        <p id="scan-status" class="feedback" role="status" hidden></p>
        <a id="open-editor" class="button" href="index.html">Open editor</a>
      </section>
    </main>

    <footer>
      <p>
        Made by
        <a href="https://www.dandanilyuk.com" target="_blank" rel="noreferrer">Dan Danilyuk</a>
      </p>
    </footer>
  </body>
</html>
